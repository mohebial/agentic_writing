name: agentic_review
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- Core dependencies ---
      - anthropic
      - google-genai
      - streamlit
      - weasyprint
      - fpdf2
      - markdown
      - python-dotenv

      # --- Local backend (optional) ---
      - "markitdown[all]"
      - llama-cpp-python
      - transformers
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.10.0+cu128
      - accelerate
      - bitsandbytes
      - flash-linear-attention
      - triton-windows        # triton for Windows (fla dependency)

# To create the environment, run the following command in your terminal:
# cd c:\GitHub\agentic_writing
# conda env create -f environment.yml
# conda activate agentic_review